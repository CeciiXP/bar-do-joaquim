<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="voltarInicio()" color="light">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title>Bar do Joaquim</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">
  <div class="login-container">
    <ion-card>
      <ion-card-content>
        <h2>Entrar na Conta</h2>
        <p class="subtitle">Acesse o sistema do bar</p>

        <ion-item fill="outline" class="custom-item">
          <ion-label position="floating">E-mail</ion-label>
          <ion-input [(ngModel)]="email" type="email" placeholder="seuemail@exemplo.com"></ion-input>
        </ion-item>

        <ion-item fill="outline" class="custom-item">
          <ion-label position="floating">Senha</ion-label>
          <ion-input [(ngModel)]="password" type="password" placeholder="******"></ion-input>
        </ion-item>

        <ion-button expand="block" (click)="loginWithEmail()" [disabled]="loading" class="ion-margin-top">
          <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
          <span *ngIf="!loading">Entrar</span>
        </ion-button>

        <div class="divider">
          <span>OU</span>
        </div>

        <ion-button expand="block" fill="outline" (click)="loginWithGoogle()" [disabled]="loading">
          <ion-icon name="logo-google" slot="start"></ion-icon>
          Entrar com Google
        </ion-button>
      </ion-card-content>
    </ion-card>

    <div class="ion-margin-top">
      <ion-button fill="clear" color="medium" (click)="voltarInicio()">
        ← Voltar para o início
      </ion-button>
    </div>
  </div>

  <ion-toast 
    [isOpen]="isToastOpen" 
    [message]="toastMessage" 
    [duration]="3000" 
    [color]="toastColor"
    (didDismiss)="isToastOpen = false">
  </ion-toast>
</ion-content>
